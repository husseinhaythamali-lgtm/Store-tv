  .tab.active{box-shadow:inset 0 0 0 1px var(--border), 0 0 0 1px rgba(34,199,240,.15);}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Cairo','Inter',sans-serif;
    height:100%;overscroll-behavior:none;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  ::-webkit-scrollbar{display:none;}

  .mono{font-family:'IBM Plex Mono',monospace; letter-spacing:0.02em;}
  .display{font-family:'Space Grotesk','Cairo',sans-serif;}

  /* ---------- Login screen ---------- */
  #login-screen{
    min-height:100dvh; display:flex; flex-direction:column; justify-content:center;
    padding:28px 22px; gap:22px; position:relative; overflow:hidden;
  }
  #login-screen::before{
    content:""; position:absolute; inset:0; z-index:0; opacity:.5;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .brand{display:flex; align-items:center; gap:10px; z-index:1;}
  .tally-dot{width:10px;height:10px;border-radius:50%;background:var(--tally);
    box-shadow:0 0 8px 2px rgba(255,59,48,.6); animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.35}}
  .brand-name{font-size:22px; font-weight:700; letter-spacing:.02em;}
  .logo-img{height:34px; width:auto; display:block; filter:drop-shadow(0 0 10px rgba(34,199,240,.35));}
  header .logo-img{height:24px;}

  /* WhatsApp floating button */
  #wa-float{
    position:fixed; z-index:90; bottom:calc(env(safe-area-inset-bottom) + 18px); inset-inline-end:16px;
    width:52px; height:52px; border-radius:50%; background:#25D366; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 16px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.08); text-decoration:none;
  }
  #wa-float svg{width:27px; height:27px;}
  #wa-float:active{transform:scale(.94);}
  .brand-sub{color:var(--text-dim); font-size:12.5px; z-index:1; margin-top:-14px;}

  .field{z-index:1;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-family:'IBM Plex Mono',monospace;}
  .field input{
    width:100%; padding:14px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:15px; font-family:'Cairo',sans-serif;
    outline:none; transition:border-color .15s;
  }
  .field input:focus{border-color:var(--amber);}
  #login-btn{
    z-index:1; margin-top:6px; padding:15px; border:none; border-radius:10px;
    background:var(--amber); color:#1a1206; font-weight:700; font-size:15.5px;
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  }
  #login-btn:active{transform:scale(.98);}
  #login-error{color:var(--tally); font-size:13px; z-index:1; display:none;}
  #login-status{color:var(--text-dim); font-size:12.5px; z-index:1; display:none; font-family:'IBM Plex Mono',monospace;}

  /* ---------- App shell ---------- */
  #app{display:none; min-height:100dvh; flex-direction:column;}
  header.top{
    position:sticky; top:0; z-index:20; background:rgba(10,11,13,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border); padding:12px 14px calc(10px);
  }
  .top-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .search-wrap{margin-top:10px; position:relative;}
  .search-wrap input{
    width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:14px; font-family:'Cairo',sans-serif; outline:none;
  }

  .tabs{display:flex; gap:6px; margin-top:12px; background:var(--surface); padding:4px; border-radius:10px;}
  .tab{
    flex:1; text-align:center; padding:9px 4px; border-radius:8px; font-size:13px; font-weight:600;
    color:var(--text-dim); cursor:pointer; transition:.15s;
  }
  .tab.active{background:var(--surface-2); color:var(--text); box-shadow:inset 0 0 0 1px var(--border);}
  .tab .tab-icon{margin-inline-end:5px;}

  .cat-strip{display:flex; gap:8px; overflow-x:auto; padding:12px 14px 4px; scroll-snap-type:x proximity;}
  .chip{
    flex:0 0 auto; padding:7px 14px; border-radius:999px; font-size:12.5px; font-family:'IBM Plex Mono',monospace;
    background:var(--surface); color:var(--text-dim); border:1px solid var(--border); white-space:nowrap; cursor:pointer;
  }
  .chip.active{background:var(--amber); color:#1a1206; border-color:var(--amber); font-weight:600;}

  main{flex:1; padding:6px 14px 90px;}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px;}
  .grid.live-grid{grid-template-columns:repeat(2,1fr);}

  .tile{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column; position:relative;
  }
  .tile:active{transform:scale(.97);}
  .tile-media{aspect-ratio:2/3; background:var(--surface-2); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;}
  .live-grid .tile-media{aspect-ratio:16/10;}
  .tile-media img{width:100%; height:100%; object-fit:cover; display:block;}
  .tile-fallback{font-size:11px; color:var(--text-dim); text-align:center; padding:6px; font-family:'IBM Plex Mono',monospace;}
  .ch-num{
    position:absolute; top:6px; inset-inline-start:6px; background:rgba(0,0,0,.65); color:var(--amber);
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:2px 6px; border-radius:5px; font-weight:500;
  }
  .tile-title{font-size:12px; padding:7px 8px 9px; line-height:1.35; color:var(--text); font-weight:500;}

  .empty, .loading{color:var(--text-dim); text-align:center; padding:60px 20px; font-size:13.5px; font-family:'IBM Plex Mono',monospace;}
  .spinner{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--amber);
    animation:spin .8s linear infinite; margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Player overlay ---------- */
  #player-overlay{
    position:fixed; inset:0; z-index:100; background:#000; display:none; flex-direction:column;
  }
  #player-overlay.open{display:flex;}
  .player-top{
    display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background:#000;
  }
  .close-btn{
    width:34px; height:34px; border-radius:50%; background:var(--surface); border:1px solid var(--border);
    color:var(--text); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; flex:0 0 auto;
  }
  .on-air{display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--tally);}
  .player-title{font-size:13.5px; color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
  video{width:100%; background:#000; flex:0 0 auto;}
  .player-body{flex:1; overflow-y:auto; padding:16px;}
  .player-meta{color:var(--text-dim); font-size:12.5px; line-height:1.6; font-family:'IBM Plex Mono',monospace; margin-bottom:16px;}

  .season-strip{display:flex; gap:8px; overflow-x:auto; margin-bottom:12px;}
  .ep-row{
    display:flex; align-items:center; gap:12px; padding:11px 8px; border-bottom:1px solid var(--border); cursor:pointer;
  }
  .ep-num{
    width:30px; height:30px; border-radius:7px; background:var(--surface); color:var(--amber);
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:12px; flex:0 0 auto;
  }
  .ep-title{font-size:13px; color:var(--text);}
  .ep-title small{display:block; color:var(--text-dim); font-size:11px; margin-top:2px;}

  .player-error{color:var(--tally); font-size:12.5px; padding:14px; text-align:center; font-family:'IBM Plex Mono',monospace;}
  a.logout-link{color:var(--text-dim); font-size:11.5px; text-decoration:underline; cursor:pointer;}
</style>
</head>

<a id="wa-float" href="https://wa.me/9647826204057" target="_blank" rel="noopener" aria-label="تواصل عبر واتساب">
  <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M16.02 3C9.4 3 4 8.36 4 14.94c0 2.24.62 4.33 1.7 6.13L3 29l8.2-2.62a12.9 12.9 0 0 0 4.82.93h.01c6.62 0 12.02-5.36 12.02-11.94C28.05 8.36 22.66 3 16.02 3Z" fill="#fff"/>
    <path d="M23.03 18.24c-.32-.16-1.9-.94-2.2-1.05-.29-.1-.5-.16-.72.16-.21.32-.83 1.05-1.02 1.27-.19.21-.37.24-.69.08-.32-.16-1.34-.5-2.55-1.58-.94-.84-1.58-1.88-1.76-2.2-.19-.32-.02-.49.14-.65.14-.14.32-.37.48-.55.16-.19.21-.32.32-.53.1-.21.05-.4-.03-.56-.08-.16-.72-1.75-.99-2.4-.26-.63-.53-.54-.72-.55h-.62c-.21 0-.56.08-.85.4-.29.32-1.12 1.1-1.12 2.68 0 1.58 1.15 3.1 1.31 3.32.16.21 2.26 3.47 5.48 4.86.77.33 1.36.53 1.83.68.77.24 1.47.21 2.02.13.62-.09 1.9-.78 2.17-1.53.27-.75.27-1.4.19-1.53-.08-.13-.29-.21-.61-.37Z" fill="#25D366"/>

</a>

<script>
(function(){
  "use strict";

  // ---------------- session state (memory only, no localStorage) ----------------
  let session = null; // { base, user, pass }
  let currentType = "live"; // live | vod | series
  let categoriesCache = {}; // type -> [{category_id,category_name}]
  let streamsCache = {};    // type -> category_id -> [items]
  let activeCategoryId = null;
  let hlsInstance = null;

  const $ = (sel) => document.querySelector(sel);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html!==undefined) e.innerHTML = html; return e; };

  function proxyWrap(url){
    if(session && session.proxy){
      return session.proxy + "/?url=" + encodeURIComponent(url);
    }
    return url;
  }

  function apiUrl(action, extra){
    let u = session.base + "/player_api.php?username=" + encodeURIComponent(session.user) +
      "&password=" + encodeURIComponent(session.pass);
    if(action) u += "&action=" + action;
    if(extra) u += extra;
    return proxyWrap(u);
  }

  async function apiGet(action, extra){
    const res = await fetch(apiUrl(action, extra));
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  // ---------------- login ----------------
  $("#login-btn").addEventListener("click", doLogin);
  [ "#in-server","#in-user","#in-pass"].forEach(sel=>{
    $(sel).addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
  });

  async function doLogin(){
    const errEl = $("#login-error"), statusEl = $("#login-status");
    errEl.style.display = "none"; statusEl.style.display = "block";
    statusEl.textContent = "جاري الاتصال بالسيرفر…";

    let server = $("#in-server").value.trim().replace(/\/+$/,"");
    const user = $("#in-user").value.trim();
    const pass = $("#in-pass").value.trim();
    const proxy = $("#in-proxy").value.trim().replace(/\/+$/,"");

    if(!/^https?:\/\//i.test(server)) server = "http://" + server;
    if(!server || !user || !pass){
      statusEl.style.display = "none";
      errEl.textContent = "عبّي كل الحقول أول.";
      errEl.style.display = "block";
      return;
    }

    session = { base: server, user, pass, proxy };

    try{
      const info = await apiGet(null, null);
      if(!info || !info.user_info || info.user_info.auth !== 1){
        throw new Error("بيانات الدخول غير صحيحة أو الحساب غير مفعّل.");
      }
      statusEl.style.display = "none";
      $("#login-screen").style.display = "none";
      $("#app").style.display = "flex";
      switchTab("live");
    }catch(err){
      statusEl.style.display = "none";
      errEl.textContent = "تعذّر الاتصال — تأكد من الرابط والبيانات. لو السيرفر HTTP فقط (بدون HTTPS)، لازم تعبّي حقل رابط البروكسي بالأسفل. (" + err.message + ")";
      errEl.style.display = "block";
      session = null;
    }
  }

  $("#logout-btn").addEventListener("click", ()=>{
    session = null; categoriesCache = {}; streamsCache = {};
    $("#app").style.display = "none";
    $("#login-screen").style.display = "flex";
    $("#in-pass").value = "";
  });

  // ---------------- tabs ----------------
  document.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click", ()=> switchTab(tab.dataset.type));
  });

  function switchTab(type){
    currentType = type;
    document.querySelectorAll(".tab").forEach(t=> t.classList.toggle("active", t.dataset.type===type));
    activeCategoryId = null;
    loadCategories(type);
  }

  const ACTIONS = {
    live:   { cats:"get_live_categories",   streams:"get_live_streams" },
    vod:    { cats:"get_vod_categories",    streams:"get_vod_streams" },
    series: { cats:"get_series_categories", streams:"get_series" }
  };

  async function loadCategories(type){
    const stripEl = $("#cat-strip");
    stripEl.innerHTML = "";
    $("#grid").innerHTML = '<div class="loading"><div class="spinner"></div>جاري تحميل القوائم…</div>';

    try{
      if(!categoriesCache[type]){
        categoriesCache[type] = await apiGet(ACTIONS[type].cats);
      }
      const cats = categoriesCache[type] || [];
      const allChip = el("div","chip active mono","الكل");
      allChip.addEventListener("click", ()=> selectCategory(type, null, allChip));
      stripEl.appendChild(allChip);

      cats.forEach(c=>{
        const chip = el("div","chip mono", c.category_name);
        chip.addEventListener("click", ()=> selectCategory(type, c.category_id, chip));
        stripEl.appendChild(chip);
      });

      selectCategory(type, null, allChip);
    }catch(err){
      $("#grid").innerHTML = '<div class="empty">تعذّر تحميل القوائم من السيرفر.<br>' + err.message + '</div>';
    }
  }

  async function selectCategory(type, catId, chipEl){
    document.querySelectorAll(".chip").forEach(c=> c.classList.remove("active"));
    if(chipEl) chipEl.classList.add("active");
    activeCategoryId = catId;

    const gridEl = $("#grid");
    gridEl.innerHTML = '<div class="loading"><div class="spinner"></div>جاري تحميل المحتوى…</div>';

    try{
      const cacheKey = catId || "__all__";
      streamsCache[type] = streamsCache[type] || {};
      if(!streamsCache[type][cacheKey]){
        const extra = catId ? "&category_id=" + encodeURIComponent(catId) : "";
        streamsCache[type][cacheKey] = await apiGet(ACTIONS[type].streams, extra);
      }
      renderGrid(type, streamsCache[type][cacheKey] || []);
    }catch(err){
      gridEl.innerHTML = '<div class="empty">تعذّر تحميل المحتوى.<br>' + err.message + '</div>';
    }
  }

  function renderGrid(type, items){
    const gridEl = $("#grid");
    gridEl.className = "grid" + (type==="live" ? " live-grid" : "");
    gridEl.innerHTML = "";

    const q = $("#search-input").value.trim().toLowerCase();
    const filtered = q ? items.filter(it => (it.name||"").toLowerCase().includes(q)) : items;

    if(!filtered.length){
      gridEl.innerHTML = '<div class="empty">ما فيه نتائج.</div>';
      return;
    }

    filtered.forEach(item=>{
      const tile = el("div","tile");
      const media = el("div","tile-media");
      const img = item.stream_icon || item.cover || "";
      if(img){
        const imgEl = document.createElement("img");
        imgEl.src = proxyWrap(img); imgEl.loading = "lazy";
        imgEl.onerror = ()=>{ imgEl.remove(); media.appendChild(el("div","tile-fallback", type==="live" ? "📡" : "🎬")); };
        media.appendChild(imgEl);
      }else{
        media.appendChild(el("div","tile-fallback", type==="live" ? "📡" : "🎬"));
      }
      if(type==="live" && item.num !== undefined){
        media.appendChild(el("div","ch-num mono", "CH " + item.num));
      }
      tile.appendChild(media);
      tile.appendChild(el("div","tile-title", item.name || ""));
      tile.addEventListener("click", ()=> openItem(type, item));
      gridEl.appendChild(tile);
    });
  }

  $("#search-input").addEventListener("input", ()=>{
    const cacheKey = activeCategoryId || "__all__";
    const items = (streamsCache[currentType] && streamsCache[currentType][cacheKey]) || [];
    renderGrid(currentType, items);
  });

  // ---------------- player ----------------
  function streamUrl(type, item){
    if(type==="live"){
      return proxyWrap(session.base + "/live/" + session.user + "/" + session.pass + "/" + item.stream_id + ".m3u8");
    }
    if(type==="vod"){
      const ext = item.container_extension || "mp4";
      return proxyWrap(session.base + "/movie/" + session.user + "/" + session.pass + "/" + item.stream_id + "." + ext);
    }
    return null; // series handled per-episode
  }

  function playVideo(url){
    const video = $("#video");
    if(hlsInstance){ hlsInstance.destroy(); hlsInstance = null; }

    if(video.canPlayType("application/vnd.apple.mpegurl")){
      video.src = url;
      video.play().catch(()=>{});
    }else if(window.Hls && Hls.isSupported()){
      hlsInstance = new Hls();
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(video);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, ()=> video.play().catch(()=>{}));
    }else{
      video.src = url;
      video.play().catch(()=>{});
    }
  }

  function openPlayerOverlay(title, isLive){
    $("#player-title-bar").textContent = title || "";
    $("#on-air-badge").style.display = isLive ? "flex" : "none";
    $("#player-overlay").classList.add("open");
  }

  $("#player-close").addEventListener("click", ()=>{
    const video = $("#video");
    video.pause(); video.removeAttribute("src"); video.load();
    if(hlsInstance){ hlsInstance.destroy(); hlsInstance = null; }
    $("#player-overlay").classList.remove("open");
    $("#player-body").innerHTML = "";
  });

  async function openItem(type, item){
    $("#player-body").innerHTML = "";

    if(type==="live"){
      openPlayerOverlay(item.name, true);
      playVideo(streamUrl("live", item));
      return;
    }

    if(type==="vod"){
      openPlayerOverlay(item.name, false);
      playVideo(streamUrl("vod", item));
      const meta = el("div","player-meta mono",
        (item.rating ? "التقييم: " + item.rating + "<br>" : "") +
        (item.added ? "أُضيف: " + new Date(item.added*1000).toLocaleDateString() : "")
      );
      $("#player-body").appendChild(meta);
      return;
    }

    // series -> show seasons/episodes, don't autoplay
    openPlayerOverlay(item.name, false);
    $("#video").removeAttribute("src");
    const body = $("#player-body");
    body.innerHTML = '<div class="loading"><div class="spinner"></div>جاري تحميل الحلقات…</div>';

    try{
      const info = await apiGet("get_series_info", "&series_id=" + encodeURIComponent(item.series_id));
      body.innerHTML = "";
      const episodesBySeason = info.episodes || {};
      const seasonKeys = Object.keys(episodesBySeason);

      if(!seasonKeys.length){
        body.innerHTML = '<div class="player-error">ما فيه حلقات متاحة لهالمسلسل.</div>';
        return;
      }

      const seasonStrip = el("div","season-strip");
      seasonKeys.forEach((sk, idx)=>{
        const chip = el("div","chip mono" + (idx===0 ? " active" : ""), "الموسم " + sk);
        chip.addEventListener("click", ()=>{
          document.querySelectorAll("#player-body .chip").forEach(c=>c.classList.remove("active"));
          chip.classList.add("active");
          renderEpisodeList(episodesBySeason[sk]);
        });
        seasonStrip.appendChild(chip);
      });
      body.appendChild(seasonStrip);
      const listWrap = el("div","ep-list");
      body.appendChild(listWrap);
      renderEpisodeList(episodesBySeason[seasonKeys[0]]);

      function renderEpisodeList(eps){
        listWrap.innerHTML = "";
        (eps||[]).forEach(ep=>{
          const row = el("div","ep-row");
          row.appendChild(el("div","ep-num mono", ep.episode_num));
          row.appendChild(el("div","ep-title", (ep.title || "حلقة " + ep.episode_num) +
            (ep.info && ep.info.duration ? "<small>" + ep.info.duration + "</small>" : "")));
          row.addEventListener("click", ()=>{
            const ext = (ep.container_extension) || "mp4";
            const url = proxyWrap(session.base + "/series/" + session.user + "/" + session.pass + "/" + ep.id + "." + ext);
            $("#player-title-bar").textContent = item.name + " — حلقة " + ep.episode_num;
            playVideo(url);
          });
          listWrap.appendChild(row);
        });
      }
    }catch(err){
      body.innerHTML = '<div class="player-error">تعذّر تحميل بيانات المسلسل. ' + err.message + '</div>';
    }
  }

})();
</script>
</body>
</html>
